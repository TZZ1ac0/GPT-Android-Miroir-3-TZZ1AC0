name: Release

on:
  push:
    branches: [main]
    paths:
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: write

# Prevent two pushes with the same version from racing to create the same tag.
concurrency:
  group: android-release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build, tag and publish Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Run unit tests and build installable debug APK
        run: gradle testDebugUnitTest assembleDebug
      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(grep '^VERSION_NAME=' gradle.properties | cut -d '=' -f2)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION_NAME must follow SemVer (X.Y.Z), got: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check whether this version was already released
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Check the remote, not only the checkout: another run may have pushed the tag
          # after this job's checkout. The concurrency group also serializes release jobs.
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            TAG_COMMIT="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
            if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "::error::Version $RELEASE_TAG is already assigned to commit $TAG_COMMIT, not $GITHUB_SHA. Bump VERSION_NAME in gradle.properties before publishing a new release."
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "The tag points to this exact commit; continuing to allow a safe workflow retry."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create tag
        if: steps.tag.outputs.exists == 'false'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
      - name: Create GitHub Release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            gh release create "${{ steps.version.outputs.tag }}" --title "${{ steps.version.outputs.tag }}" --notes-file CHANGELOG.md
          fi
      - name: Attach installable APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" app/build/outputs/apk/debug/app-debug.apk --clobber
